<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>설계 면접 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="marked.min.js"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1c1c1e;--mute:#6b6b70;--line:#e4e4e0;--acc:#c2410c;--acc-soft:#fff1e8;--code:#f1f1ee;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1a1b1e;--fg:#ececec;--mute:#9a9aa0;--line:#2c2d31;--acc:#fb923c;--acc-soft:#2a1d14;--code:#24252a}}
:root[data-theme="dark"]{--bg:#111214;--card:#1a1b1e;--fg:#ececec;--mute:#9a9aa0;--line:#2c2d31;--acc:#fb923c;--acc-soft:#2a1d14;--code:#24252a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.7 "Noto Sans KR",system-ui,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
button{cursor:pointer}
.tools{max-width:760px;margin:0 auto;padding:0 16px 10px;display:none;gap:8px}
.tools.on{display:flex}
.tools select{flex:1;min-width:0}
.tools input{width:38%}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.sec{margin:22px 0 8px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;text-decoration:none;color:var(--fg)}
.card b{display:block;font-size:16px}
.card span{font-size:13px;color:var(--mute)}
.card .tag{float:right;font-size:12px;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:1px 8px}
.week label,.day label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.55}
.day summary{cursor:pointer;font-size:15px;font-weight:500;list-style:none;display:flex;gap:6px;align-items:center}
.day summary::-webkit-details-marker{display:none}
.day summary .cnt{margin-left:auto;font-size:12px;color:var(--mute);background:var(--code);border-radius:999px;padding:1px 8px}
.day[open] summary{margin-bottom:6px}
.day input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.day .d{font-weight:700;color:var(--acc);margin-right:4px}
.day .min{font-size:12px;color:var(--acc);margin-right:6px}
.day .hint{font-size:13px;color:var(--mute)}
.day label.done .t{color:var(--mute);text-decoration:line-through}
.day .eve{font-size:13px;color:var(--mute);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.exam{border-color:var(--acc);background:var(--acc-soft)}
.exam .dday{float:right;font-size:22px;font-weight:700;color:var(--acc)}
.exam b{font-size:16px}
.exam details{margin-top:8px;font-size:14px}
.exam summary{cursor:pointer;color:var(--acc);font-weight:500}
.exam table{border-collapse:collapse;margin-top:6px;width:100%}
.exam th{text-align:left;vertical-align:top;white-space:nowrap;padding:5px 10px 5px 0;font-size:13px;color:var(--mute);font-weight:500}
.exam td{padding:5px 0;font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
.exam th{border-top:1px solid var(--line)}
.hint{font-size:12px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:6px 2px}
.sub{font-size:12px;color:var(--mute);margin:14px 2px 2px}
.fold summary{cursor:pointer}
.tag.st-완료{color:#1d4ed8;background:#e0eaff}.tag.st-일부{color:#b45309;background:#fff1d6}.tag.st-미확인{color:var(--mute);background:var(--code)}
.week label:first-of-type{border-top:0}
.week input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.week .d{font-weight:700;color:var(--acc);margin-right:4px}
.week label.done .t{color:var(--mute);text-decoration:line-through}
.doc{word-break:keep-all;overflow-wrap:anywhere}
.doc h1{font-size:1.45em;line-height:1.35}
.doc h2{font-size:1.25em;margin-top:2em;padding-top:.6em;border-top:2px solid var(--line)}
.doc h3{font-size:1.08em;margin-top:1.8em;color:var(--acc)}
.doc h2,.doc h3{scroll-margin-top:110px}
.doc table{display:block;overflow-x:auto;border-collapse:collapse;font-size:.9em;margin:1em 0}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;min-width:90px}
.doc th{background:var(--code)}
.doc code{background:var(--code);border-radius:5px;padding:1px 5px;font-size:.9em}
.doc pre{background:var(--code);padding:12px;border-radius:10px;overflow-x:auto;font-size:.85em}
.doc pre code{padding:0}
.doc blockquote{margin:1em 0;padding:8px 14px;border-left:4px solid var(--acc);background:var(--acc-soft);border-radius:0 10px 10px 0}
.doc mark{background:#fde047;color:#111}
.doc img{max-width:100%}
#top{position:fixed;right:16px;bottom:20px;border-radius:999px;width:44px;height:44px;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.15);display:none}
.foot{font-size:12px;color:var(--mute);margin-top:30px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="home" aria-label="목록" style="display:none">←</button>
    <h1 id="title">설계 면접 노트</h1>
    <button id="fs" aria-label="글자 크기">가</button>
    <button id="theme" aria-label="테마">◐</button>
  </div>
  <div class="tools" id="tools">
    <select id="toc" aria-label="목차"></select>
    <input id="q" type="search" placeholder="찾기" aria-label="문서 내 찾기">
  </div>
</header>
<main id="main"></main>
<button id="top" aria-label="맨 위로">↑</button>

<script>
let DOCS=[],DECKS=[],WEEK=null,MD={},GROUPS=[],EXAM=null;

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// theme & font size
const root=document.documentElement;
let theme=store.get('theme',null); if(theme) root.dataset.theme=theme;
$('#theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;theme=dark?'light':'dark';root.dataset.theme=theme;store.set('theme',theme)};
const SIZES=[15,16,17,19]; let fsi=store.get('fsi',1);
const applyFs=()=>root.style.setProperty('--fs',SIZES[fsi]+'px'); applyFs();
$('#fs').onclick=()=>{fsi=(fsi+1)%SIZES.length;applyFs();store.set('fsi',fsi)};

function renderHome(){
  $('#title').textContent='설계 면접 노트'; $('#home').style.display='none'; $('#tools').classList.remove('on');
  const done=store.get(WEEK.id,[]);
  const t=new Date(), today=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  let ti=WEEK.days.findIndex(d=>d.d===today); if(ti<0) ti=WEEK.days.findIndex(d=>d.d>today); 
  let h='';
  if(EXAM){const dd=Math.ceil((new Date(EXAM.date+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
    h+=`<div class="card exam"><div class="dday">${dd>0?'D-'+dd:dd===0?'D-DAY':'끝'}</div><b>${esc(EXAM.title)}</b>`+
      `<details><summary>일정 · 장소 · 준비물</summary><table>${EXAM.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></details>`+
      `<details><summary>11/24까지 주차 계획</summary><table>${EXAM.plan.map(r=>`<tr><th>${esc(r[0])}<br><span class="hint">${esc(r[1])}</span></th><td>${esc(r[2])}</td></tr>`).join('')}</table></details></div>`;}
  h+=`<div class="sec">${esc(WEEK.title)}</div><p class="note">${esc(WEEK.note)}</p>`;
  WEEK.days.forEach((d,di)=>{
    const n=d.b.filter((_,bi)=>done.includes(di+'-'+bi)).length;
    h+=`<details class="card day" ${di===ti?'open':''}><summary><span class="d">${esc(d.k)}</span>${esc(d.th)}<span class="cnt">${n}/${d.b.length}</span></summary>`+
      d.b.map((x,bi)=>{const k=di+'-'+bi,on=done.includes(k);return `<label class="${on?'done':''}"><input type="checkbox" data-k="${k}" ${on?'checked':''}><span class="t"><span class="min">${esc(x[0])}</span><b>${esc(x[1])}</b><br><span class="hint">${esc(x[2])}</span></span></label>`}).join('')+
      `<p class="eve">${esc(d.e)}</p></details>`;
  });
  h+=`<p class="note">${esc(WEEK.later)}</p>`;
  GROUPS.forEach(([g,name])=>{
    const ds=DOCS.filter(d=>d.g===g); if(!ds.length) return;
    const body=ds.map(d=>`<a class="card" href="#${d.id}">${d.tag?`<span class="tag">${esc(d.tag)}</span>`:''}<b>${esc(d.t)}</b><span>${esc(d.s)}</span></a>`).join('');
    h+= g==='old' ? `<details class="fold"><summary class="sec">${esc(name)}</summary>${body}</details>` : `<div class="sec">${esc(name)}</div>${body}`;
  });
  h+=`<div class="sec">슬라이드 덱 (claude.ai 로그인 필요)</div>`;
  [...new Set(DECKS.map(d=>d.g))].forEach(g=>{
    h+=`<div class="sub">${esc(g)}</div>`+DECKS.filter(d=>d.g===g).map(d=>`<a class="card" href="${d.u}" target="_blank" rel="noopener"><span class="tag st-${esc(d.st)}">${esc(d.st)}</span><b>${esc(d.t)} ↗</b><span>${esc(d.s)}</span></a>`).join('');
  });
  h+=`<p class="foot">체크 표시와 글자 크기는 이 기기 브라우저에만 저장돼요. 공개 사이트라 개인 경험 연결 문장은 빼고 올렸어요. 로그인은 7일간 유지돼요.</p><p><button id="logout">로그아웃</button></p>`;
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('.day input').forEach(cb=>cb.onchange=()=>{
    const k=cb.dataset.k; let d=store.get(WEEK.id,[]);
    d=cb.checked?[...new Set([...d,k])]:d.filter(x=>x!==k); store.set(WEEK.id,d);
    cb.closest('label').classList.toggle('done',cb.checked);
    const det=cb.closest('details'); det.querySelector('.cnt').textContent=det.querySelectorAll('input:checked').length+'/'+det.querySelectorAll('input').length;
  });
  $('#logout').onclick=()=>{document.cookie='skhkey=; max-age=0; path=/';location.reload()};
  window.scrollTo(0,0);
}

function renderDoc(id,anchor){
  const d=DOCS.find(x=>x.id===id); if(!d) return renderHome();
  $('#title').textContent=d.t; $('#home').style.display=''; $('#tools').classList.add('on'); $('#q').value='';
  const el=document.createElement('article'); el.className='doc'; el.innerHTML=marked.parse(MD[id]||'');
  el.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  const toc=$('#toc'); toc.innerHTML='<option value="">목차로 이동</option>';
  el.querySelectorAll('h2,h3').forEach((h,i)=>{h.id='h'+i;const o=document.createElement('option');o.value=h.id;o.textContent=(h.tagName==='H3'?'　· ':'')+h.textContent;toc.appendChild(o)});
  $('#main').replaceChildren(el);
  const pos=store.get('pos:'+id,0);
  if(anchor&&document.getElementById(anchor)) document.getElementById(anchor).scrollIntoView(); else window.scrollTo(0,pos);
}
$('#toc').onchange=e=>{const v=e.target.value;if(v)document.getElementById(v).scrollIntoView({behavior:'smooth'});e.target.value=''};

// find in doc
let qt; $('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>find(e.target.value.trim()),250)};
$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();nextHit()}};
let hits=[],hi=-1;
function find(term){
  const art=$('#main .doc'); if(!art) return;
  art.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent)); art.normalize();
  hits=[];hi=-1; if(term.length<2) return;
  const w=document.createTreeWalker(art,NodeFilter.SHOW_TEXT); const nodes=[]; let n; while(n=w.nextNode()) if(n.nodeValue.includes(term)) nodes.push(n);
  nodes.forEach(t=>{const parts=t.nodeValue.split(term);const f=document.createDocumentFragment();parts.forEach((p,i)=>{f.append(p);if(i<parts.length-1){const m=document.createElement('mark');m.textContent=term;f.append(m);hits.push(m)}});t.replaceWith(f)});
  nextHit();
}
function nextHit(){if(!hits.length)return;hi=(hi+1)%hits.length;hits[hi].scrollIntoView({block:'center'})}

// routing
function route(){const [id,anchor]=location.hash.slice(1).split('/');id?renderDoc(decodeURIComponent(id),anchor):renderHome()}
$('#home').onclick=()=>{location.hash=''};
addEventListener('hashchange',()=>{if(WEEK)route()});
let st; addEventListener('scroll',()=>{$('#top').style.display=scrollY>800?'block':'none';clearTimeout(st);st=setTimeout(()=>{const id=location.hash.slice(1).split('/')[0];if(id)store.set('pos:'+id,scrollY)},300)});
$('#top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

// lock: data.enc.json is AES-GCM encrypted; key = PBKDF2(password). Key kept in a 7-day cookie.
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const WEEK_S=7*24*3600;
let ENC=null;
async function loadEnc(){if(!ENC){const r=await fetch('data.enc.json',{cache:'no-cache'});ENC=await r.json()}return ENC}
async function decryptWith(raw){
  const e=await loadEnc();
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},key,b64d(e.ct));
  const c=JSON.parse(new TextDecoder().decode(pt));
  DOCS=c.docs;DECKS=c.decks;WEEK=c.week;MD=c.md;GROUPS=c.groups||[];EXAM=c.exam||null;
}
async function deriveRaw(pw){
  const e=await loadEnc();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(e.salt),iterations:e.iter},base,256);
}
const getCookie=n=>(document.cookie.split('; ').find(x=>x.startsWith(n+'='))||'').slice(n.length+1);
function saveKey(raw){document.cookie=`skhkey=${encodeURIComponent(b64e(raw))}; max-age=${WEEK_S}; path=/; SameSite=Strict`+(location.protocol==='https:'?'; Secure':'')}
function showLock(msg){
  $('#tools').classList.remove('on');$('#home').style.display='none';$('#title').textContent='설계 면접 노트';
  $('#main').innerHTML=`<form id="lock" class="card" style="margin-top:12vh;text-align:center;padding:28px 20px">
    <b style="font-size:18px">🔒 비밀번호를 입력하세요</b>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="12" aria-label="비밀번호"
      style="display:block;width:100%;margin:18px 0 12px;font-size:24px;letter-spacing:.4em;text-align:center;padding:12px">
    <button type="submit" style="width:100%;padding:12px;font-size:16px;background:var(--acc);color:#fff;border:0">열기</button>
    <p id="lmsg" style="color:var(--acc);font-size:14px;min-height:1.4em;margin:12px 0 0">${msg||''}</p></form>`;
  const pw=$('#pw'); pw.focus();
  $('#lock').onsubmit=async ev=>{
    ev.preventDefault(); $('#lmsg').textContent='확인 중…';
    try{const raw=await deriveRaw(pw.value);await decryptWith(raw);saveKey(raw);route()}
    catch(e){$('#lmsg').textContent=ENC?'비밀번호가 맞지 않아요.':'불러오지 못했어요. 네트워크를 확인해 주세요.';pw.value='';pw.focus()}
  };
}
(async()=>{
  const c=getCookie('skhkey');
  if(c){try{const raw=b64d(decodeURIComponent(c));await decryptWith(raw);saveKey(raw);return route()}catch(e){document.cookie='skhkey=; max-age=0; path=/'}}
  showLock();
})();
</script>
</body>
</html>
